<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Wireshark analysis mechanism: Kali Linux sends a cleartext login to Ubuntu, Wireshark captures the individual TCP packets on the wire, and Follow TCP Stream reassembles those packets into one readable conversation that exposes the plaintext username and password." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1000" height="600" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Wireshark Analysis — Follow TCP Stream Reveals Cleartext Credentials</text>

  <!-- Kali box -->
  <rect x="120" y="60" width="220" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Kali Linux VM</text>
  <text x="230" y="103" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">192.168.64.2/24 — client</text>
  <text x="230" y="119" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">sends login</text>

  <!-- Ubuntu box -->
  <rect x="660" y="60" width="220" height="70" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.5"/>
  <text x="770" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Ubuntu VM</text>
  <text x="770" y="103" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">192.168.64.3/24 — server</text>
  <text x="770" y="119" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">FTP / Telnet / HTTP service</text>

  <!-- Login arrow -->
  <text x="500" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">cleartext login (FTP / Telnet / HTTP)</text>
  <line x1="340" y1="100" x2="660" y2="100" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b91c1c">USER + PASS sent as plain text</text>

  <!-- Tap down to Wireshark -->
  <line x1="500" y1="130" x2="500" y2="168" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Wireshark box -->
  <rect x="390" y="170" width="220" height="55" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
  <text x="500" y="193" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Wireshark</text>
  <text x="500" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">captures packets on the wire</text>

  <line x1="500" y1="225" x2="500" y2="258" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#111827">raw TCP segments (.pcap)</text>

  <!-- Packet row -->
  <rect x="235" y="258" width="90" height="40" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="280" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#374151">TCP #1</text>
  <rect x="345" y="258" width="90" height="40" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="390" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#374151">TCP #2</text>
  <rect x="455" y="258" width="90" height="40" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="500" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#374151">TCP #3</text>
  <rect x="565" y="258" width="90" height="40" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="610" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#374151">TCP #4</text>
  <rect x="675" y="258" width="90" height="40" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="720" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#374151">TCP #5</text>

  <line x1="500" y1="298" x2="500" y2="350" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#111827">Follow TCP Stream</text>
  <text x="520" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">reassembles packets into one conversation</text>

  <!-- Reassembled stream panel -->
  <rect x="150" y="360" width="700" height="190" rx="8" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5"/>
  <text x="170" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Reassembled TCP Stream</text>

  <rect x="172" y="396" width="340" height="20" rx="3" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="180" y="411" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">C →  USER dae_student</text>

  <text x="180" y="433" font-family="Consolas, monospace" font-size="12.5" fill="#4b5563">S ←  331 Password required</text>

  <rect x="172" y="440" width="330" height="20" rx="3" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="180" y="455" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">C →  PASS Spring2026!</text>

  <text x="180" y="477" font-family="Consolas, monospace" font-size="12.5" fill="#4b5563">S ←  230 Login successful</text>
  <text x="180" y="499" font-family="Consolas, monospace" font-size="11" fill="#6b7280">... session continues in cleartext ...</text>

  <!-- Note -->
  <text x="500" y="578" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Both the username and password travel as plain text — anyone capturing this traffic can read them directly.</text>
</svg>
