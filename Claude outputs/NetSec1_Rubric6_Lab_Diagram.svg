<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 725" role="img" aria-label="Network Security 1 Rubric 6 lab topology: pfSense firewall routes between the Internet and an internal 192.168.64.0/24 network hosted in UTM on the Mac, where Kali Linux at 192.168.64.2 sends attack traffic to Ubuntu at 192.168.64.3 while Wireshark taps the segment to capture and analyze that traffic." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1000" height="725" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Network Security 1 — Rubric 6 Lab Topology</text>

  <!-- Internet box -->
  <rect x="380" y="50" width="240" height="55" rx="8" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="500" y="73" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Internet / Upstream Network</text>
  <text x="500" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">(Mac host's physical network)</text>

  <!-- Host boundary -->
  <rect x="60" y="140" width="880" height="550" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="80" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">UTM — Virtualization Host (Mac, Apple Silicon)</text>

  <!-- Internet <-> pfSense link -->
  <line x1="500" y1="105" x2="500" y2="185" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="514" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111827">WAN — external traffic</text>

  <!-- pfSense box -->
  <rect x="390" y="185" width="220" height="90" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/>
  <text x="500" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">pfSense VM</text>
  <text x="500" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">Firewall / Router</text>
  <text x="500" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">NAT + filtering rules</text>
  <text x="500" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#111827">LAN gateway 192.168.64.1</text>

  <!-- pfSense -> switch -->
  <line x1="500" y1="275" x2="500" y2="330" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="514" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#111827">routes / firewalls internal traffic</text>

  <!-- Switch segment -->
  <line x1="150" y1="330" x2="850" y2="330" stroke="#111827" stroke-width="3"/>
  <text x="500" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Internal Lab Network — 192.168.64.0/24 (virtual switch)</text>

  <!-- Switch -> Kali -->
  <line x1="275" y1="330" x2="275" y2="420" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="378" font-family="Consolas, monospace" font-size="11" fill="#111827">192.168.64.2/24</text>

  <!-- Switch -> Ubuntu -->
  <line x1="725" y1="330" x2="725" y2="420" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="378" font-family="Consolas, monospace" font-size="11" fill="#111827">192.168.64.3/24</text>

  <!-- Kali box -->
  <rect x="165" y="420" width="220" height="95" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="275" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Kali Linux VM</text>
  <text x="275" y="466" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">Attacker / pentest toolkit</text>
  <text x="275" y="483" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">(Wireshark runs here)</text>

  <!-- Ubuntu box -->
  <rect x="615" y="420" width="220" height="95" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.5"/>
  <text x="725" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Ubuntu VM</text>
  <text x="725" y="466" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">Target host</text>

  <!-- Kali <-> Ubuntu attack traffic -->
  <line x1="385" y1="467" x2="615" y2="467" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="500" y="555" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">attack / test traffic (scans, exploits, service probes)</text>

  <!-- Wireshark tap -->
  <line x1="500" y1="467" x2="500" y2="600" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="410" y="600" width="180" height="50" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
  <text x="500" y="622" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Wireshark</text>
  <text x="500" y="638" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#374151">taps &amp; analyzes segment traffic</text>

  <!-- Legend note -->
  <text x="80" y="705" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#4b5563">All VMs run inside UTM on the Mac host. Dashed line = passive packet capture, not a routed hop.</text>
</svg>
